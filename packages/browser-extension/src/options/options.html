<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Cost options</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #202124;
      background: #fff;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .lede { color: #5f6368; margin: 0 0 24px; }
    fieldset { border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin: 0 0 16px; }
    legend { font-weight: 600; padding: 0 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
    label { display: block; font-weight: 500; }
    label small { display: block; font-weight: 400; color: #5f6368; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px;
      border: 1px solid #dadce0; border-radius: 6px; font: inherit; background: inherit; color: inherit;
    }
    textarea { min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
    .check input { margin-top: 4px; }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button {
      background: #1a73e8; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: transparent; color: #1a73e8; border: 1px solid #dadce0; }
    #status { color: #188038; }
    #errors { color: #d93025; white-space: pre-line; margin: 8px 0 0; }
    .preview { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
    .preview strong { color: #d93025; font-size: 18px; }
    code { background: #f1f3f4; padding: 1px 5px; border-radius: 4px; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      fieldset, input, select, textarea, button.secondary { border-color: #5f6368; }
      .lede, label small { color: #9aa0a6; }
      .preview, code { background: #303134; }
      .preview strong { color: #f28b82; }
      #status { color: #81c995; }
      #errors { color: #f28b82; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Meeting Cost</h1>
    <p class="lede">Hourly rates live only in your browser's extension storage. Nothing is sent anywhere.</p>

    <form id="form">
      <fieldset>
        <legend>Defaults</legend>
        <div class="grid">
          <label>Default hourly rate
            <small>Used for anyone without a match below</small>
            <input type="number" id="defaultHourlyRate" min="0" step="0.01">
          </label>
          <label>Currency
            <small>ISO code, e.g. USD, EUR, GBP</small>
            <input type="text" id="currency" maxlength="3" pattern="[A-Za-z]{3}">
          </label>
          <label>Hours per year
            <small>Converts salaries to hourly (2080 = 40 h × 52 wk)</small>
            <input type="number" id="hoursPerYear" min="1" step="1">
          </label>
          <label>Overhead multiplier
            <small>1 = salary only, 1.3 = fully loaded</small>
            <input type="number" id="overheadMultiplier" min="0" step="0.05">
          </label>
          <label>Refresh
            <small>How often the live number updates</small>
            <select id="tickSeconds">
              <option value="60">Every minute</option>
              <option value="10">Every 10 seconds</option>
              <option value="1">Every second</option>
            </select>
          </label>
          <label>Overrun grace (minutes)
            <small>Keep counting this long after the scheduled end</small>
            <input type="number" id="overrunGraceMinutes" min="0" step="1">
          </label>
        </div>
        <p>
          <label class="check"><input type="checkbox" id="includeDeclined"> Count guests who declined</label>
          <label class="check"><input type="checkbox" id="includeResources"> Count rooms and other resources</label>
        </p>
      </fieldset>

      <fieldset>
        <legend>Rates by person or domain</legend>
        <label for="rates">One per line: <code>email = amount/hr</code>, <code>email = amount/yr</code>, or <code>@domain = amount</code>
          <small>Exact e-mail wins over <code>@domain</code>, which wins over the default. <code>180k/yr</code> works too. Lines starting with <code>#</code> are comments.</small>
        </label>
        <textarea id="rates" spellcheck="false" placeholder="john.smith@acme.com = 144.23/hr
olivia.jones@acme.com = 300000/yr
@acme.com = 95
@partner.io = 180k/yr"></textarea>
        <p id="errors" role="alert"></p>
      </fieldset>

      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" class="secondary" id="reset">Reset to defaults</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <div class="preview" id="preview"></div>
  </main>
  <script src="../vendor/meeting-cost-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
